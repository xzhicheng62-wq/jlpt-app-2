<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>大家的日语 · 初级II</title>
    <style>
        :root { --pink: #ff6b9d; --light-pink: #fff0f5; --bg: #fdf5f9; --text: #4a4a4a; --sub: #999; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 10px; padding-bottom: 100px; overflow-x: hidden; position: relative; }
        
        /* ============ 特效层 ============ */
        .fx-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; overflow: hidden; }
        .fx-sun-beam { position: absolute; top: -50%; right: -20%; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,255,0,0.4) 0%, transparent 70%); animation: beam 1.5s ease-out forwards; }
        .fx-rainbow { position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border-radius: 50%; border: 20px solid transparent; border-top-color: #ff6b9d; border-right-color: #ffb347; border-bottom-color: #a8e6cf; border-left-color: #6b9dff; animation: rainbowFade 2s ease-out forwards; }
        .fx-flower { position: absolute; font-size: 24px; animation: windBlow 2s ease-out forwards; }
        .fx-petal { position: absolute; top: -30px; font-size: 20px; animation: petalFall linear forwards; }
        .fx-star-burst { position: absolute; font-size: 24px; animation: starBurst 0.9s ease-out forwards; }
        .fx-bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,182,213,0.4)); animation: bubbleUp linear forwards; }
        .fx-heart { position: absolute; font-size: 24px; animation: heartFloat 2s ease-out forwards; }
        .fx-firework { position: absolute; width: 4px; height: 4px; border-radius: 50%; animation: fireworkBurst 1s ease-out forwards; }
        .fx-dark { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s; }
        .fx-lightning { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; animation: flash 0.15s 3; }
        .fx-rain { position: absolute; top: -10px; width: 2px; height: 15px; background: #6b9dff; opacity: 0.7; animation: rainFall 0.5s linear infinite; }
        .fx-vortex { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-radius: 50%; background: radial-gradient(circle, #000 0%, transparent 70%); transform: translate(-50%, -50%); animation: vortexGrow 1.5s ease-in forwards; }
        .fx-shard { position: absolute; width: 20px; height: 20px; background: rgba(200,220,255,0.6); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); animation: shardFly 1s ease-out forwards; }
        .fx-crack { position: absolute; top: 50%; left: 50%; width: 300px; height: 300px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); animation: crackFlash 0.8s ease-out forwards; }
        .fx-blood { position: absolute; top: -10px; width: 2px; height: 18px; background: #8b0000; opacity: 0.8; animation: rainFall 0.5s linear infinite; }
        .fx-skull { position: absolute; top: -40px; font-size: 28px; animation: skullDrop linear forwards; }
        .fx-frost { position: absolute; font-size: 30px; animation: frostSpread 1.5s ease-out forwards; }
        .fx-frost-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, rgba(200,230,255,0.6) 100%); opacity: 0; animation: frostFade 1.5s ease-out forwards; }
        
        @keyframes beam { 0% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
        @keyframes rainbowFade { 0% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; } 100% { opacity: 0; transform: scale(1.2); } }
        @keyframes windBlow { 0% { transform: translateX(-100px) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(100vw) rotate(360deg); opacity: 0; } }
        @keyframes petalFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0; } }
        @keyframes starBurst { 0% { transform: translate(0, 0) scale(0.3); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.8); opacity: 0; } }
        @keyframes bubbleUp { 0% { transform: translateY(0) scale(0.5); opacity: 0.8; } 100% { transform: translateY(-105vh) scale(1.2); opacity: 0; } }
        @keyframes heartFloat { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.5); opacity: 0; } }
        @keyframes fireworkBurst { 0% { transform: translate(0, 0) scale(3); opacity: 1; box-shadow: 0 0 20px currentColor; } 100% { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; } }
        @keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } }
        @keyframes rainFall { 0% { transform: translateY(0); } 100% { transform: translateY(105vh); } }
        @keyframes vortexGrow { 0% { width: 0; height: 0; opacity: 0.9; } 100% { width: 250vmax; height: 250vmax; opacity: 0; } }
        @keyframes shardFly { 0% { transform: translate(0, 0) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(720deg); opacity: 0; } }
        @keyframes crackFlash { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2); } }
        @keyframes skullDrop { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(105vh) rotate(360deg); opacity: 0.3; } }
        @keyframes frostSpread { 0% { transform: scale(0.3) rotate(0deg); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(2) rotate(90deg); opacity: 0; } }
        @keyframes frostFade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
        
        body.shake { animation: shakeScreen 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeScreen { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        
        /* ============ 界面样式 ============ */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .top-bar h1 { font-size: 1.1rem; color: var(--pink); font-weight: 800; }
        .top-bar .stats { font-size: 0.8rem; color: var(--sub); background: #fff; padding: 2px 10px; border-radius: 12px; box-shadow: 0 2px 6px rgba(255,107,157,0.1); }
        .scroll-x { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .scroll-x::-webkit-scrollbar { display: none; }
        .btn-pill { white-space: nowrap; padding: 6px 14px; background: #fff; border: 1px solid #ffb7c5; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; color: #888; }
        .btn-pill.active { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: 0 4px 10px rgba(255,107,157,0.3); }
        .word-card { background: #fff; border: 1px solid #ffe4ec; border-radius: 12px; padding: 38px 12px 12px 12px; margin-bottom: 8px; position: relative; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 8px rgba(255,107,157,0.05); }
        .word-card:active { transform: scale(0.99); }
        .word-jp { font-size: 1.3rem; font-weight: bold; color: #333; }
        .word-kana { font-size: 0.95rem; color: #888; margin-top: 2px; }
        .word-romaji { font-size: 0.85rem; color: #bbb; margin-top: 2px; }
        .word-cn { font-size: 1rem; color: var(--pink); font-weight: 600; margin-top: 6px; }
        .word-type { font-size: 0.7rem; background: #ff9f43; color: #fff; padding: 2px 8px; border-radius: 10px; position: absolute; top: 10px; left: 12px; }
        .speaker-btn { position: absolute; right: 12px; top: 16px; background: #fff0f5; border: 1px solid var(--pink); width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; color: var(--pink); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .speaker-btn:active { transform: scale(0.9); }
        .word-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ffe4ec; background: #fff8fa; padding: 10px; border-radius: 8px; }
        .word-card.open .word-details { display: block; }
        .conjugation-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #ffe4ec; font-size: 0.9rem; }
        .conjugation-item:last-child { border-bottom: none; }
        .grammar-item { background: #fff; border: 1px solid #ffe4ec; border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
        .grammar-header { padding: 12px; font-weight: bold; cursor: pointer; color: #333; }
        .grammar-body { display: none; padding: 12px; background: #fff8fa; border-top: 1px solid #ffe4ec; }
        .grammar-item.open .grammar-body { display: block; }
        .grammar-desc { font-size: 0.9rem; background: #fff0f5; padding: 10px; border-radius: 8px; margin-bottom: 10px; color: #666; line-height: 1.5; }
        .example { background: #fff; padding: 10px; margin-bottom: 6px; border-left: 3px solid var(--pink); border-radius: 0 8px 8px 0; }
        .example .jp { font-weight: bold; font-size: 0.95rem; color: #333; }
        .example .romaji { font-size: 0.85rem; color: #bbb; margin: 2px 0; }
        .example .cn { font-size: 0.9rem; color: #666; }
        .quiz-tabs { display: flex; border-bottom: 2px solid #ffe4ec; margin-bottom: 15px; overflow-x: auto; }
        .quiz-tabs::-webkit-scrollbar { display: none; }
        .quiz-tabs button { flex: 0 0 auto; white-space: nowrap; background: none; border: none; padding: 12px 14px; font-size: 0.85rem; font-weight: bold; color: #b0b0b0; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .quiz-tabs button.active { color: var(--pink); border-bottom: 2px solid var(--pink); }
        .quiz-question-box { background: #fff; border: 1px solid #ffe4ec; padding: 30px 15px; text-align: center; margin-bottom: 10px; border-radius: 12px; box-shadow: 0 4px 12px rgba(255,107,157,0.05); }
        .quiz-question-box .q-text { font-size: 1.8rem; font-weight: bold; word-break: break-all; color: #333; }
        .quiz-question-box .q-sub { color: #888; margin-top: 5px; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .quiz-options button { display: block; width: 100%; background: #fff; border: 1px solid #ffb7c5; padding: 15px; text-align: left; font-size: 1rem; border-radius: 10px; cursor: pointer; word-break: break-all; color: #333; transition: 0.2s; }
        .quiz-options button:active { background: #fff0f5; }
        .quiz-options button.correct { background: #e5f9e5; border-color: #34c759; color: #34c759; box-shadow: 0 4px 12px rgba(52,199,89,0.15); }
        .quiz-options button.wrong { background: #ffe5e5; border-color: #ff3b30; color: #ff3b30; box-shadow: 0 4px 12px rgba(255,59,48,0.15); }
        .quiz-result { text-align: center; background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #ffe4ec; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff; border-top: 1px solid #ffe4ec; display: flex; z-index: 999; padding-bottom: env(safe-area-inset-bottom, 20px); }
        .nav-item { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: #b0b0b0; cursor: pointer; }
        .nav-item.active { color: var(--pink); }
        .nav-item .icon { font-size: 1.4rem; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="top-bar"><h1 id="pageTitle">第26课</h1><div class="stats" id="statsInfo">26 / 50</div></div>
    <div class="scroll-x" id="lessonSelector"></div>
    <div class="scroll-x" id="filterBar">
        <button class="btn-pill active" data-type="all">全部</button>
        <button class="btn-pill" data-type="noun">名词</button>
        <button class="btn-pill" data-type="verb">动词</button>
        <button class="btn-pill" data-type="adjective">形容词</button>
        <button class="btn-pill" data-type="other">其他</button>
    </div>
    <div id="mainView">
        <div id="wordList"></div>
        <div id="grammarList" style="display: none;"></div>
        <div id="quizContainer" class="quiz-container" style="display: none;"></div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('vocab')"><span class="icon">📝</span>单词</button>
        <button class="nav-item" onclick="switchTab('grammar')"><span class="icon">📚</span>语法</button>
        <button class="nav-item" onclick="switchTab('quiz')"><span class="icon">🎯</span>测试</button>
    </div>

<script>
    // 数据区（稍后一段段粘贴进来）
    const masterData = {};
    // ----------------- 第 26 课 全量数据 -----------------
    masterData["26"] = { v: [["みます","みます","看、诊断","verb"],["さがします","さがします","寻找、搜索","verb"],["おくれます","おくれます","晚了、没赶上","verb"],["まにあいます","まにあいます","赶上","verb"],["やります","やります","做、干、搞","verb"],["ひろいます","ひろいます","拾","verb"],["れんらくします","れんらくします","联系","verb"],["きぶんがいい","きぶんがいい","舒服","adjective"],["きぶんがわるい","きぶんがわるい","不舒服","adjective"],["うんどうかい","うんどうかい","运动会","noun"],["ぼんおどり","ぼんおどり","盂兰盆会舞","noun"],["フリーマーケット","フリーマーケット","跳蚤市场","noun"],["ばしょ","ばしょ","场所、地点","noun"],["ボランティア","ボランティア","义工、志愿者","noun"],["さいふ","さいふ","钱包","noun"],["ごみ","ごみ","垃圾","noun"],["こっかいぎじどう","こっかいぎじどう","国会议事堂","noun"],["へいじつ","へいじつ","平日","noun"],["～へん","～へん","～方言","other"],["こんど","こんど","这次、下次","other"],["ずいぶん","ずいぶん","极其、相当","other"],["ちょくせつ","ちょくせつ","直接","other"],["いつでも","いつでも","随时","other"],["どこでも","どこでも","在任何地方都～","other"],["だれでも","だれでも","任何人都～","other"],["なんでも","なんでも","什么都～","other"],["こんな～","こんな～","这样的～","other"],["そんな～","そんな～","那样的～","other"],["あんな～","あんな～","那样的～","other"],["エドヤストア","エドヤストア","(虚构的商店)","noun"]], g: [{ r:"～んです / ～んですか", d:"【中式理解】用于口语，书面语用「～のです」。1. 对所见所闻加以确认或要求说明。2. 要求更详细的说明。3. 要求说明理由。4. 要求就事态予以说明。", e:[["(ぬれた 傘を 持って いる 人を 見て) 雨が 降って いるんですか。","（看见拿着淋湿的雨伞的人）下雨呢吗？"],["おもしろい デザインの 靴ですね。どこで 買ったんですか。","真是一双样式很别致的鞋子啊，在哪儿买的？"],["どうして 遅れたんですか。","你为什么迟到了？"],["どう したんですか。","你怎么了？"]] }, { r:"～んですが、～", d:"【中式理解】「～んですが」有提起话头的作用，后面一般接续表示委托、劝诱或请求许可等表现。", e:[["頭が 痛いんですが、帰っても いいですか。","我有点儿头疼，可以回去吗？"],["来週 友達と スキーに 行くんですが、ミラーさんも いっしょに 行きませんか。","我下星期和朋友去滑雪，米勒不一起去吗？"],["お湯が 出ないんですが……。","还没有热水……。"]] }, { r:"动词て形 いただけませんか", d:"【中式理解】这是较之「～て ください」更为礼貌的提出请求的表达方式。相当于“能帮我……吗？”。", e:[["いい 先生を 紹介して いただけませんか。","您能帮我介绍一位好老师吗？"]] }, { r:"疑问词 动词たら いいですか", d:"【中式理解】希望对方出主意、提建议以及给予指示的表达方式。相当于“……（做）好呢？”。", e:[["どこで カメラを 買ったら いいですか。","在哪儿买照相机好呢？"],["……ABCストアが 安いですよ。","……ABC商场比较便宜。"],["国会議事堂を 見学したいんですが、どう したら いいですか。","我想去参观国会议事堂，应该怎么办呢？"],["……直接 行ったら いいですよ。","……直接去就行了。"]] }, { r:"名词(对象)は ～", d:"【中式理解】在初级I，我们学习了把用「を」表示的直接宾语作为主题提示的用法（第17课）。如③所示，作为「すきです」等的对象的用「が」来表示的名词也可以作为主题来提示。", e:[["よく カラオケに 行きますか。","你经常去卡拉OK吗？"],["……いいえ、あまり 行きません。カラオケは 好きじゃ ないんです。","……不，不怎么去。我不喜欢卡拉OK。"]] }] };
    // ----------------- 第 27 课 全量数据 -----------------
    masterData["27"] = { v: [["かいます","かいます","饲养","verb"],["はしります","はしります","跑、奔驰","verb"],["みえます","みえます","看见","verb"],["きこえます","きこえます","听见","verb"],["できます","できます","建好、交上、做好","verb"],["ひらきます","ひらきます","开、举办","verb"],["しんぱい","しんぱい","担心","adjective"],["ペット","ペット","宠物","noun"],["とり","とり","鸟","noun"],["こえ","こえ","声音","noun"],["なみ","なみ","波浪","noun"],["はなび","はなび","烟花","noun"],["どうぐ","どうぐ","工具","noun"],["クリーニング","クリーニング","(干)洗、洗衣","noun"],["いえ","いえ","家、住宅","noun"],["マンション","マンション","公寓","noun"],["キッチン","キッチン","厨房","noun"],["～きょうしつ","～きょうしつ","～教室","other"],["パーティールーム","パーティールーム","宴会厅","noun"],["かた","かた","人(「ひと」的尊敬语)","noun"],["～ご","～ご","～后","other"],["～しか","～しか","只(后接否定)","other"],["ほかの","ほかの","其他的","other"],["はっきり","はっきり","清楚地","other"],["いつか","いつか","什么时候","other"],["たてます","たてます","建、盖","verb"],["すばらしい","すばらしい","很棒、很好","adjective"],["子どもたち","こどもたち","孩子们","noun"],["大好き","だいすき","非常喜欢","adjective"],["主人公","しゅじんこう","主人公","noun"],["形","かたち","形状、样子","noun"],["不思議","ふしぎ","不可思议","adjective"],["ポケット","ポケット","口袋、兜","noun"],["例えば","たとえば","例如","other"],["付けます","つけます","戴上","verb"],["自由に","じゆうに","自由地、随意地","other"],["空","そら","天空","noun"],["飛びます","とびます","飞、飞翔","verb"],["音","おと","声音","noun"],["自分","じぶん","自己","noun"],["将来","しょうらい","将来","noun"],["ドラえもん","ドラえもん","哆啦A梦","noun"]], g: [{ r:"可能动词", d:"【中式理解】作为表示可能的形式，在初级I第18课，学习过「名词/动词字典形+ことが できます」。在这里，作为表示可能的另一种形式，来学习可能动词。I类：词尾变え段+る；II类：词尾る变られる；III类：します→できる、来ます→来られる。", e:[["かきます → かけます","たべます → たべられます","します → できます"]] }, { r:"可以使用可能动词的句子", d:"【中式理解】1. 可能动词表示的是状态，而不是动作。他动词的宾语用助词「を」表示，可能动词的对象原则上用「が」来表示。2. 可能动词用来表示行为者的能力(5)和某一状态下的行为之可能(6)。", e:[["わたしは 日本語を 話します。","我说日语。"],["わたしは 日本語が 話せます。","我能说日语。"],["一人で 病院へ 行けますか。","你能一个人去医院吗？"],["田中さんに 会えませんでした。","我没能见到田中。"],["ミラーさんは 漢字が 読めます。","米勒会念汉字。"],["この 銀行で ドルが 換えられます。","这家银行可以兑换美元。"]] }, { r:"見えます 和 聞こえます", d:"【中式理解】「みえます」「きこえます」表示的不是有意识地看/听，而是某一对象物自然地进入视野，或某一声音自然地传到耳朵里。其对象用「が」来表示。", e:[["新幹線から 富士山が 見えます。","从新干线上可以看到富士山。"],["ラジオの 音が 聞こえます。","能听到收音机的声音。"],["新宿で 今 黒沢の 映画が 見られます。","在新宿，现在可以看黑泽导演的电影。"],["電話で 天気予報が
